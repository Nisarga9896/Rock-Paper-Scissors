{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Start the RPS Battle robotic duel protocol.">
    <title>RPS Battle — Start</title>
    <link rel="stylesheet" href="{% static 'game/style.css' %}?v=20">
</head>
<body class="intro-screen">
    <div class="ambient" aria-hidden="true"></div>

    <main class="intro-layout">
        <section class="intro-hero">
            <p class="eyebrow"><span>SYS</span> Battle protocol</p>
            <h1>Rock. Paper. <em>Scissors.</em></h1>
            <p class="intro-copy">A fast robotic duel. Pick a move, read the machine, and take the match.</p>

            <div class="intro-rules">
                <span><strong>10</strong> damage per round</span>
                <span><strong>10</strong> points to victory</span>
                <span><strong>1v1</strong> machine duel</span>
            </div>

            <a class="start-button" href="{% url 'home' %}">
                <span>START GAME</span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <p class="intro-note">No sign-up. Instant battle.</p>
        </section>

        <aside class="intro-core" aria-hidden="true">
            <div class="core-orbit core-orbit--outer"></div>
            <div class="core-orbit core-orbit--inner"></div>
            <img src="{% static 'game/images/rock-real.png' %}" alt="">
            <span class="core-label">SYSTEM READY</span>
        </aside>
    </main>
</body>
</html>
